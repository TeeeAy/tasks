apiVersion: v1
kind: ServiceAccount
metadata:
  name: probes-demo-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: probes-demo-role
  namespace: default
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - pods
      - endpoints
      - services
      - events
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: probes-demo-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: probes-demo-sa
    namespace: default
roleRef:
  kind: Role
  name: probes-demo-role
  apiGroup: rbac.authorization.k8s.io
